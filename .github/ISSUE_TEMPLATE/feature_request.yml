name: Feature request
description: An idea for something TrafficPi should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        TrafficPi does not read licence plates, identify faces or people, or enforce anything (see the README's non-goals), and needs no cloud service. Ideas that need those will not be built.
  - type: textarea
    id: problem
    attributes:
      label: What do you want to be able to do?
      description: The thing you cannot do now, rather than the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you change?
      description: Optional. plan.md has the decisions (D1 and on) that already cover a lot; say if yours would change one.
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
