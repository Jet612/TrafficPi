name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # The project must use a system Python (see [tool.uv] in pyproject.toml), as on the Pi.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10
        with:
          version: "0.12.24"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pyright
        run: uv run pyright

      # Tests that need the camera or the accelerator are skipped automatically (see --hardware).
      - name: Tests
        run: uv run pytest
