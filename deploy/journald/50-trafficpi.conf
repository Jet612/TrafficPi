# TrafficPi: keep the journal across reboots, with a size and an age limit.
#
# Raspberry Pi OS keeps the journal in RAM only (/usr/lib/systemd/journald.conf.d/
# 40-rpi-volatile-storage.conf, to spare the SD card), so everything the services said before a
# reboot, the nightly one included, is gone afterwards and `journalctl -b -1` shows nothing. This
# file overrides that (it sorts after 40-). In steady state the journal grows by a few MB a day;
# each start of the vision service adds a burst of the Hailo driver's warnings (dozens of stack
# traces). The limits below bound it either way.
#
# Installed by `scripts/install_services.sh --persistent-journal`; `--journal-off` puts the
# Raspberry Pi OS default back.
[Journal]
Storage=persistent
SystemMaxUse=256M
MaxRetentionSec=1month
